metrics-server:
  replicas: 2
  resources:
    requests: { cpu: 110m, memory: 200Mi }
    limits:   { cpu: 500m, memory: 500Mi }
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  args:
    - --kubelet-preferred-address-types=InternalIP
    - --kubelet-use-node-status-port
    - --metric-resolution=15s
