# Loki SimpleScalable deployment with S3 backend.
# S3 bucket + IRSA role are created by eks-observability-iac.
#
# Replace the dummy AWS account ID and bucket names before tagging a release.
#
# Remember: everything sits under the top-level `loki:` key (the upstream
# chart's name). The upstream chart has its own inner `loki:` section, which
# is why `loki:` appears twice.

loki:
  # In-cluster caches were over-allocated relative to actual usage on our scale.
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false

  # We load alert rules from a ConfigMap we mount ourselves (see
  # backend.extraVolumes below), so the chart's built-in rules sidecar is off.
  sidecar:
    rules:
      enabled: false

  loki:
    auth_enabled: false

    schemaConfig:
      configs:
        - from: 2025-01-01
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: loki_index_
            period: 24h

    storage:
      type: s3
      bucketNames:
        chunks: observability-cluster-loki-chunks-000000000000
        ruler: observability-cluster-loki-ruler-000000000000
      s3:
        region: eu-central-1
        insecure: false
        s3ForcePathStyle: false

    # FIX: the old `loki.ruler` key is not read by this chart, so the ruler
    # settings were ignored. Ruler settings go through `structuredConfig`.
    #
    # Rules are read from local files (a ConfigMap from the gitops repo),
    # not from the S3 ruler bucket. With auth disabled, Loki looks for the
    # rule files in a folder called "fake" inside the directory below.
    structuredConfig:
      ruler:
        storage:
          type: local
          local:
            directory: /etc/loki/rules
        rule_path: /tmp/rules
        alertmanager_url: http://prometheus-alertmanager.observability.svc.cluster.local:9093
        enable_api: true
        enable_alertmanager_v2: true
        ring:
          kvstore:
            store: inmemory

    commonConfig:
      replication_factor: 1

    limits_config:
      retention_period: 30d
      max_query_parallelism: 16
      max_query_series: 5000
      max_entries_limit_per_query: 5000
      max_query_length: 720h
      query_timeout: 5m
      max_line_size: 256KB
      max_streams_per_user: 10000
      split_queries_by_interval: 1h
      ingestion_rate_mb: 8
      ingestion_burst_size_mb: 16

  deploymentMode: SimpleScalable

  backend:
    replicas: 1
    persistence:
      storageClass: gp3
      size: 10Gi
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits:   { cpu: 500m, memory: 512Mi }
    # FIX: one ConfigMap (loki-rules, created by the gitops repo in
    # manifests/loki/rules), mounted into the "fake" tenant folder.
    #
    # `optional: true` matters: ArgoCD deploys Loki (wave 3) long before the
    # rules (wave 8) and waits for Loki to be healthy first. Without
    # `optional`, Loki would wait forever for a ConfigMap that is not
    # created until Loki is healthy - a deadlock.
    extraVolumes:
      - name: loki-rules
        configMap:
          name: loki-rules
          optional: true
    extraVolumeMounts:
      - name: loki-rules
        mountPath: /etc/loki/rules/fake

  read:
    replicas: 1
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits:   { cpu: 500m, memory: 512Mi }

  write:
    replicas: 1
    persistence:
      storageClass: gp3
      size: 10Gi
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits:   { cpu: 1000m, memory: 1Gi }

  gateway:
    enabled: true
    replicas: 1
    resources:
      requests: { cpu: 25m, memory: 64Mi }
      limits:   { cpu: 200m, memory: 256Mi }

  serviceAccount:
    create: true
    annotations:
      eks.amazonaws.com/role-arn: "arn:aws:iam::000000000000:role/observability-cluster-loki"