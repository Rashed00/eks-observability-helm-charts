# Envoy Gateway = the Gateway API implementation we use for all in-cluster
# routing. The Gateway/HTTPRoute/SecurityPolicy CRs themselves live in the
# gitops repo (manifests/gateway-api/).

gateway-helm:
  deployment:
    envoyGateway:
      replicas: 1
      resources:
        limits:   { memory: 512Mi, cpu: 500m }
        requests: { cpu: 100m, memory: 256Mi }

  config:
    envoyGateway:
      gateway:
        controllerName: gateway.envoyproxy.io/gatewayclass-controller
      provider:
        type: Kubernetes
      logging:
        level:
          default: info
